spring.application.name=orbit

spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:orbit_db}
spring.datasource.username=${DB_USER:orbit_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway gerencia o schema; o Hibernate só valida o mapeamento
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# CORS — origins do front (separar por vírgula em produção)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# JWT (HS256) — use segredo longo em produção via .env
app.jwt.secret=${JWT_SECRET:orbit-dev-secret-change-me-to-a-long-random-string-32chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
