<nav
  class="bg-sidebar text-sidebar-foreground border-sidebar-border safe-area-bottom fixed inset-x-0 bottom-0 z-40 border-t"
>
  <ul class="flex h-16 items-stretch justify-around px-2">
    @for (item of navItems(); track item.url) {
    <li class="flex flex-1">
      <a
        [routerLink]="item.url"
        routerLinkActive
        #mobileRla="routerLinkActive"
        class="text-muted-foreground flex w-full flex-col items-center justify-center gap-1 text-xs aria-[current=page]:font-semibold aria-[current=page]:text-primary"
        [attr.aria-current]="mobileRla.isActive ? 'page' : null"
      >
        <ng-icon [name]="item.icon" class="text-lg" />
        <span>{{ item.title }}</span>
      </a>
    </li>
    }
    <li class="flex flex-1">
      <app-user-account-menu variant="bottom" side="top" align="end" />
    </li>
  </ul>
</nav>
